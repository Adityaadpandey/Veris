[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "write", path = "." }]

[profile.ci]
fuzz = { runs = 100 }

[profile.lite]
optimizer = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
# Free testnet for zero-cost deploys; faucet ETH only.
base_sepolia = "https://sepolia.base.org"
# Arc testnet (chain 5042002). Gas is paid in USDC, get it from faucet.circle.com
arc = "https://rpc.testnet.arc.network"

[etherscan]
arc = { key = "${ARCSCAN_API_KEY}", chain = 5042002, url = "https://testnet.arcscan.app/api" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }

